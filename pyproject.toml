[project]
name = "codereader"
version = "2.0.0"
description = "Offline, evidence-grounded Python project reader"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pyinstaller>=6.15,<7",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
  ".uv-cache",
  "backend/build",
  "backend/dist",
  "frontend",
  "llama.cpp",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
files = ["backend/app"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = "backend/(build|dist)/"

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0
